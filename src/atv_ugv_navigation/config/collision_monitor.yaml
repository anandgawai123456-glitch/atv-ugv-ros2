collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /diff_drive_controller/cmd_vel

    transform_tolerance: 0.5
    source_timeout: 0.5
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: true

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: "[[0.35, 0.25], [0.35, -0.25], [0.0, -0.25], [0.0, 0.25]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop

    PolygonSlow:
      type: "polygon"
      points: "[[0.70, 0.35], [0.70, -0.35], [0.0, -0.35], [0.0, 0.35]]"
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_slow

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: /scan
